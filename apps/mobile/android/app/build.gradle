apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// Resolve the versionCode from the VERSION_CODE env (github.run_number in CI),
// falling back to 1 for local/debug builds. The -Pandroid.injected.version.code
// override did not take effect, so every AAB kept the hardcoded 1 and Play
// rejected the 0.2.0 upload as already used by the first manual 0.1.0 release.
// Computed as a plain Integer up front so the DSL call below is unambiguous.
def envVersionCode = System.getenv("VERSION_CODE")
def resolvedVersionCode = (envVersionCode == null || envVersionCode.trim().isEmpty()) ? 1 : envVersionCode.trim().toInteger()

// Android's user-visible versionName is independent from the monotonic
// versionCode. Regular releases use X.Y.Z; internal builds may append one
// numeric build segment (X.Y.Z.N). Local builds fall back to the shared,
// strictly three-part mobile package version.
def packageVersion = new JsonSlurper().parse(file("../../package.json")).version.toString()
if (!(packageVersion ==~ /^\d+\.\d+\.\d+$/)) {
    throw new GradleException("apps/mobile/package.json version must be X.Y.Z, got '${packageVersion}'")
}
def envVersionName = System.getenv("VERSION_NAME")
def resolvedVersionName = (envVersionName == null || envVersionName.trim().isEmpty()) ? packageVersion : envVersionName.trim()
if (!(resolvedVersionName ==~ /^\d+\.\d+\.\d+(?:\.\d+)?$/)) {
    throw new GradleException("Android VERSION_NAME must be X.Y.Z or X.Y.Z.N, got '${resolvedVersionName}'")
}

android {
    namespace = "com.plainva.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.plainva.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        // Plainva Labs (docs/engineering/Labs_Channel.md): a feature branch
        // built as a third app next to the store app, with its own data, URL
        // scheme and launcher shortcuts (src/labs/res). labs-mobile.yml signs
        // it with the upload key and attaches the APK to a draft release; it
        // never goes to Play.
        labs {
            initWith release
            applicationIdSuffix '.labs'
            versionNameSuffix '-labs'
            matchingFallbacks = ['release']
        }
        // Isolated native TLS fixture: production network config and a
        // non-debuggable app, signed locally only. Never distributed.
        tlsTest {
            initWith release
            applicationIdSuffix '.tlstest'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
    if (project.hasProperty('tlsInstrumentation')) testBuildType 'tlsTest'
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // WebDavHttpPlugin: arbitrary HTTP methods (PROPFIND & friends) that
    // HttpURLConnection-based CapacitorHttp cannot send.
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.android.gms:play-services-auth:22.0.0"
    testImplementation "junit:junit:$junitVersion"
    // android.jar stubs org.json on the unit-test classpath: every call
    // returns a default and a parser test would pass on nothing. The real
    // implementation makes WidgetSnapshotTest meaningful (plan Widgets, W3).
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    androidTestImplementation "com.squareup.okhttp3:okhttp-tls:4.12.0"
    // Same runtime driver as capacitor-community/sqlite; the native storage
    // instrumentation test needs its Java API on the test compile classpath.
    androidTestImplementation 'net.zetetic:sqlcipher-android:4.17.0@aar'
    androidTestImplementation 'androidx.sqlite:sqlite:2.4.0'
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
