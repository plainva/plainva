version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    ignore:
      # Version 12 requires Safari 17.4; the supported floor is still Safari 16.4.
      # Keep 11.x updates enabled and reconsider this with a platform-floor change.
      - dependency-name: mermaid
        versions: ["12.x"]
      # The npm halves of the Tauri pairs move by hand together with their
      # crates (see the cargo entry below and
      # docs/engineering/Dependency_Updates.md). Majors still arrive here.
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: cargo
    directory: "/apps/desktop/src-tauri"
    ignore:
      # Tauri crates and their npm halves must share major.minor, or
      # `tauri build` refuses them (guard: apps/desktop/src/tauriVersionPairs.test.ts).
      # Dependabot splits them into one cargo and one npm pull request that are
      # each red on their own (#114/#115), so both halves move by hand in one
      # commit: docs/engineering/Dependency_Updates.md. Majors still arrive here.
      - dependency-name: tauri
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: tauri-build
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "tauri-plugin-*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      # imap 2.4.1 pins its own imap-proto 0.10; moving imap-proto alone puts two
      # copies with mismatched types in the tree (#107). Leave it until imap has
      # a stable release on imap-proto 0.16, then move both together.
      - dependency-name: imap-proto
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-all:
        patterns: ["*"]
