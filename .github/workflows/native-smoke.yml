name: Native Smoke

# Native WebDriver smoke: build the Tauri app and drive the REAL binary through
# @wdio/tauri-service — WebView2 on Windows, WebKitGTK on Linux, WKWebView on
# macOS — the coverage the mocked Playwright suites cannot give (the gap that
# let the macOS print bug, issue #6, ship). See docs/engineering/WebDriver_Smoke.md.
#
# Linux and Windows use the external driver (tauri-driver) against the plain
# debug binary. macOS has no external driver: its job builds the app bundle
# with the cargo feature `webdriver-smoke`, which compiles the embedded
# WebDriver server (tauri-plugin-wdio-webdriver) into this build and no other.
#
# When it runs: on demand, every Monday, on a push to main that touches the
# native side or the smoke itself, and from release.yml for every release. It
# is not a required check for main: a native build per push is too slow.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/src-tauri/**'
      - 'apps/desktop/wdio/**'
      - 'apps/desktop/wdio.conf.ts'
      - 'apps/desktop/scripts/check-webdriver-server.sh'
      - '.github/workflows/native-smoke.yml'
  workflow_call:
    inputs:
      macos_may_fail:
        description: 'The macOS job reports, but a red result does not fail the caller (probation: five green runs in a row first)'
        type: boolean
        default: false

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: System deps (Tauri + WebKitGTK WebDriver)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
      - run: pnpm install --frozen-lockfile
      - name: Build web assets
        run: pnpm --filter desktop build
      - name: Build debug binary
        run: pnpm --filter desktop exec tauri build --debug --no-bundle
      # Built without the smoke feature: the binary check must find nothing.
      - name: No embedded WebDriver server in a build without the feature
        run: bash apps/desktop/scripts/check-webdriver-server.sh apps/desktop/src-tauri/target/debug/plainva-desktop
      - name: Native smoke
        run: xvfb-run --auto-servernum pnpm --filter desktop test:native
      - name: Upload driver logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-smoke-linux-${{ github.run_attempt }}
          path: apps/desktop/wdio-logs/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
      - run: pnpm install --frozen-lockfile
      - name: Build web assets
        run: pnpm --filter desktop build
      # With the smoke overlay (src-tauri/tauri.smoke.conf.json): the WebView
      # library always sets the browser arguments itself, so the debugging port
      # the Edge driver asks for through the environment never reached the
      # browser process (measured 2026-10-06: its command line carried the
      # library's arguments and nothing else). The overlay puts the port into
      # those arguments. It exists only in this build; no release uses it.
      - name: Build debug binary
        run: pnpm --filter desktop exec tauri build --debug --no-bundle --config src-tauri/tauri.smoke.conf.json
      - name: No embedded WebDriver server in a build without the feature
        shell: bash
        run: bash apps/desktop/scripts/check-webdriver-server.sh apps/desktop/src-tauri/target/debug/plainva-desktop.exe
      # Before the driver gets the binary: does it start at all, and does it
      # create its WebView? "session not created: DevToolsActivePort file doesn't
      # exist" (first runs, 2026-09-29/30) says only that the driver waited a
      # minute for a browser that never reported in — a binary that exits at
      # once and a WebView that ignores the driver's debugging port look the
      # same from there. This step tells them apart and never fails the job.
      - name: Does the binary start on its own?
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = "apps/desktop/src-tauri/target/debug/plainva-desktop.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Host "binary exited after start, exit code $($p.ExitCode)" } else { Write-Host "binary is running (pid $($p.Id))" }
          Get-Process -Name msedgewebview2 -ErrorAction SilentlyContinue | Select-Object Id, StartTime | Format-Table
          Get-ChildItem "$env:LOCALAPPDATA\com.plainva.desktop" -ErrorAction SilentlyContinue | Select-Object Name | Format-Table
          (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Process -Name msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          # The driver reaches a WebView2 app through two environment variables:
          # its own user data folder, and a debugging port. If the app's WebView
          # honours them, the port file appears in THAT folder. If it does not,
          # the driver waits for a file that is written somewhere else.
          $probe = Join-Path $env:RUNNER_TEMP "wv2-probe"
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          $env:WEBVIEW2_USER_DATA_FOLDER = $probe
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9333"
          $q = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          Write-Host "with the driver's variables: running=$(-not $q.HasExited)"
          Write-Host "port file in the given folder: $(Test-Path (Join-Path $probe 'EBWebView\DevToolsActivePort'))"
          Write-Host "port file in the app's own folder: $(Test-Path "$env:LOCALAPPDATA\com.plainva.desktop\EBWebView\DevToolsActivePort")"
          Get-ChildItem $probe -ErrorAction SilentlyContinue | Select-Object Name | Format-Table
          # Third run: the folder was taken, the port was not. Did the argument
          # reach the WebView's browser process at all? Its command line says.
          Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'" | Where-Object { $_.CommandLine -notmatch '--type=' } | ForEach-Object { Write-Host "browser process: $($_.CommandLine)" }
          try { (Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 http://127.0.0.1:9333/json/version).Content } catch { Write-Host "port 9333 does not answer: $($_.Exception.Message)" }
          if (-not $q.HasExited) { Stop-Process -Id $q.Id -Force }
          Get-Process -Name msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item Env:WEBVIEW2_USER_DATA_FOLDER; Remove-Item Env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
      - name: Native smoke
        run: pnpm --filter desktop test:native
      - name: Upload driver logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-smoke-windows-${{ github.run_attempt }}
          path: apps/desktop/wdio-logs/
          if-no-files-found: ignore
          retention-days: 7

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    # Probation (release gate): until the macOS smoke has been green five runs
    # in a row, the release calls it with macos_may_fail and records the
    # result instead of stopping on it. Every other trigger reports honestly.
    continue-on-error: ${{ inputs.macos_may_fail == true }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
          # The feature compiles different artefacts; keep them apart from
          # every other macOS cache.
          key: webdriver-smoke
      - run: pnpm install --frozen-lockfile
      - name: Build web assets
        run: pnpm --filter desktop build
      # The app BUNDLE, not the bare binary: only inside Plainva.app does the
      # process carry the bundle identifier com.plainva.desktop, and with it the
      # defaults domain the spell checking of issue #135 lives in. The overlay
      # empties the update sources and builds no updater artefacts (they would
      # need the release signing key). Debug builds are signed ad hoc and carry
      # no quarantine attribute, so Gatekeeper does not ask.
      - name: Build the smoke app (with the embedded WebDriver server)
        run: pnpm --filter desktop exec tauri build --debug --bundles app --features webdriver-smoke --config src-tauri/tauri.smoke.macos.conf.json
      # Positive control for the release check: the same script that fails a
      # release binary carrying the server has to find it here.
      - name: The smoke build carries the server, and the check sees it
        run: |
          set -euo pipefail
          ls -la apps/desktop/src-tauri/target/debug/bundle/macos/*.app/Contents/MacOS/
          bash apps/desktop/scripts/check-webdriver-server.sh --expect-present apps/desktop/src-tauri/target/debug/bundle/macos/*.app/Contents/MacOS/*
      - name: Native smoke
        run: pnpm --filter desktop test:native
      - name: What the spell checking left in the app's defaults
        if: always()
        run: defaults read com.plainva.desktop 2>&1 | head -n 40 || true
      - name: Upload driver logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-smoke-macos-${{ github.run_attempt }}
          path: apps/desktop/wdio-logs/
          if-no-files-found: ignore
          retention-days: 7
