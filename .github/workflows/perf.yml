name: Performance

# The performance budgets of the performance plan (package L0, decision E4):
# the core measurement on the 10 000-note fixture and the start bundles of
# both shells, each against a baseline in the repository. How the baselines
# work and how to record one: docs/engineering/Performance_Notes.md,
# "Performance gates". The browser measurement is a report and runs by hand
# (`pnpm perf:browser`), not here.

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Daily on main: the search for tables the budget misses runs through
  # without a push cancelling it (`tables` below).
  schedule:
    - cron: "17 3 * * *"

concurrency:
  # A scheduled run is never cancelled by a push.
  group: perf-${{ github.ref }}-${{ github.event_name == 'schedule' && github.run_id || 'push' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  core:
    name: Performance budget (core)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The baseline this job is held against (core-baseline.json). A runner
      # image change can move the ratios: record anew when it does.
      PERF_ENV: github-ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Core measurement against the baseline
        run: pnpm perf:core --json "$RUNNER_TEMP/perf-core.json"

      - name: Keep the measurement
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-core
          path: ${{ runner.temp }}/perf-core.json
          if-no-files-found: ignore

  bundle:
    name: Bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gate opens each built bundle in a browser: what loads shortly after the start, apart from the start.
      - name: Install Playwright Chromium
        run: pnpm --filter desktop exec playwright install --with-deps chromium

      - name: Start bundles against the baseline
        run: pnpm perf:bundle --json "$RUNNER_TEMP/perf-bundle.json"

      - name: Keep the measurement
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-bundle
          path: ${{ runner.temp }}/perf-bundle.json
          if-no-files-found: ignore

  tables:
    name: Table budget search
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generated tables of a seed drawn anew on every run, each at the table
      # budget, read by every parser of the app under a heap of 128 MB
      # (scripts/perf/table-budget.ts, `--hunt`). No count the unit tests can
      # make sees every cost of a table (a cell of many words); this run
      # measures the heap. A table that does not pass names its seed and
      # shape: it goes into `--check` as a fixed shape, and the weights are
      # calibrated anew (Performance_Notes.md, "Many tables in one note").
      # The reading view is run as the core can run it: the note prepared
      # (`prepareReaderSource`), GFM, remark-math and its HTML tree, without
      # KaTeX's layout of the formulas (the desktop's, L14); the desktop
      # app's tag pills and highlights are held by a unit test of their own
      # (`readerTableBudget.test.tsx`), React and the DOM not at all.
      - name: Tables at the budget under a capped heap
        run: pnpm --filter @plainva/core perf:tables -- --hunt 200 --minutes 20

      # The same 200 tables every run (seed 956860): a note of one table the
      # table budget reads as a table is read as a table, the note's budget
      # notwithstanding (L14; 18 of these became text before it held).
      - name: The tables of seed 956860 under a capped heap
        run: pnpm --filter @plainva/core perf:tables -- --hunt 200 --seed 956860 --minutes 20

  notes:
    name: Note budget search (${{ matrix.shell }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shell: [phone, desktop]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generated notes of a seed drawn anew on every run, blocks of every kind
      # mixed, from a tenth to five times the shell's note budget, each read as
      # the app reads it — the index and the note source, on the desktop the
      # reading view as well — under the shell's heap, in time, and with a scan
      # linear in the note (scripts/perf/note-budget.ts, `--hunt`). A note that
      # does not pass names its seed and number.
      - name: Notes over the budget under a capped heap
        run: pnpm --filter @plainva/core perf:notes -- --hunt 40 --minutes 20 --shell ${{ matrix.shell }}

  notes-check:
    name: Note budget check (${{ matrix.shell }}, ${{ matrix.group }}/${{ matrix.groups }})
    runs-on: ubuntu-latest
    # The desktop reads notes four times the phone's under 512 MB: one form there can take half an hour.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shell: phone, groups: 4, group: 1 }
          - { shell: phone, groups: 4, group: 2 }
          - { shell: phone, groups: 4, group: 3 }
          - { shell: phone, groups: 4, group: 4 }
          - { shell: desktop, groups: 6, group: 1 }
          - { shell: desktop, groups: 6, group: 2 }
          - { shell: desktop, groups: 6, group: 3 }
          - { shell: desktop, groups: 6, group: 4 }
          - { shell: desktop, groups: 6, group: 5 }
          - { shell: desktop, groups: 6, group: 6 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every calibrated form of the shell (scripts/perf/noteBudgetShells.json) read under the shell's heap with its
      # readers: formatted at its threshold times 1.05 as `main` reads it, at its threshold as the app reads it under
      # the least heap `main` needs there, at three and ten times over it, its ratio to `main`'s limit as calibrated,
      # and the scan's time with the note's budget against without it (scripts/perf/note-budget.ts, `--check`).
      - name: The shell's forms at and over the note's budget
        run: pnpm --filter @plainva/core perf:notes -- --check --shell ${{ matrix.shell }} --group ${{ matrix.group }}/${{ matrix.groups }}
