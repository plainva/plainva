name: Release Mobile

# Android release pipeline (M3E package K, ADR 0011 tag namespaces):
# an annotated `mobile-v*` tag builds the web assets, syncs Capacitor and
# produces a signed AAB + APK draft release. Signing is gated on secrets —
# without them the job builds an UNSIGNED release bundle as a build check
# (store uploads always need the signed path). iOS ships separately through
# the existing ios.yml TestFlight workflow (workflow_dispatch).
#
# Required secrets for signed builds:
#   ANDROID_KEYSTORE_BASE64   base64 of the release .jks/.keystore
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password

on:
  push:
    tags:
      - "mobile-v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Android version name (X.Y.Z or X.Y.Z.N); defaults to apps/mobile/package.json"
        type: string
        required: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Resolve Android version name
        id: mobile_version
        env:
          REQUESTED_VERSION: ${{ inputs.version_name }}
        run: |
          version="$REQUESTED_VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#mobile-v}"
          elif [ -z "$version" ]; then
            version="$(node -p "require('./apps/mobile/package.json').version")"
          fi

          if [[ ! "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(\.[0-9]+)?$ ]]; then
            echo "::error::Android version name must be X.Y.Z or X.Y.Z.N, got '$version'."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_base=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

          # A fourth segment means an interim build between coordinated releases.
          # Its only addressee is the maintainer, on two devices — so it becomes a
          # draft rather than something everyone browsing the releases page walks
          # past. Coordinated releases (X.Y.Z) stay public pre-releases.
          if [ -n "${BASH_REMATCH[2]}" ]; then
            echo "interim=true" >> "$GITHUB_OUTPUT"
          else
            echo "interim=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm --filter mobile build

      - name: Capacitor sync
        working-directory: apps/mobile
        run: npx cap sync android

      - name: Decode keystore
        id: keystore
        # The step always runs; the body decodes the keystore only when the
        # secret is set. (The `secrets` context is NOT available in `if:`
        # conditions, so guarding the step with it breaks the workflow parse.)
        working-directory: apps/mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release bundle (signed when secrets exist)
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # A unique, increasing versionCode per run — the manifest's fixed 1
          # was already used by the first manual upload, and Play rejects a
          # duplicate versionCode. VERSION_NAME is independently user-visible:
          # regular releases use X.Y.Z, internal builds may use X.Y.Z.N.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.mobile_version.outputs.version }}
        run: |
          # The gradle wrapper needs its execute bit on the Linux runner
          # (cap sync regenerates the android project; the checkout carries no
          # +x on Windows-authored files).
          chmod +x ./gradlew
          if [ -f release.keystore ]; then
            ./gradlew bundleRelease assembleRelease \
              -Pandroid.injected.version.code="$VERSION_CODE" \
              -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          else
            echo "No signing secrets — building unsigned release as a build check."
            ./gradlew bundleRelease assembleRelease -Pandroid.injected.version.code="$VERSION_CODE"
          fi

      # Auto-upload to the Play internal test track when the service-account
      # secret exists (secrets are NOT allowed in `if:`, so gate on a step
      # output). The app must have been published once manually first — Play
      # only lets the API bespeak an app that already exists in a track.
      - name: Check Play upload secret
        id: play
        env:
          SA_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA_JSON" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Upload AAB to the Play internal test track
        if: steps.play.outputs.present == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.plainva.app
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      # A coordinated release (X.Y.Z) is published, because the APK is how someone
      # installs the Android build without Play, and a draft is invisible to
      # everyone but the maintainer. It stays a PRE-release: `latest` must keep
      # pointing at the desktop release, which is where the updater fetches
      # `latest.json` — a mobile release without the flag breaks auto-update for
      # everyone.
      #
      # An interim build (X.Y.Z.N) is drafted instead. It exists for the
      # maintainer's two devices, reaches Play's internal track either way, and
      # has no business sitting in the public list — four of them did, which is
      # what prompted this split.
      - name: Publish GitHub release with artifacts
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          draft: ${{ steps.mobile_version.outputs.interim == 'true' }}
          prerelease: ${{ steps.mobile_version.outputs.interim != 'true' }}
          # The tag is `mobile-v0.5.14`; the title should read the version, not
          # repeat the namespace back at the reader.
          name: Plainva Mobile ${{ steps.mobile_version.outputs.version }}
          files: |
            apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
            apps/mobile/android/app/build/outputs/apk/release/app-release*.apk
