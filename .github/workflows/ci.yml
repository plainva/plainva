name: CI

on:
  push:
    # feature/** too: long-lived branches (the AI harness, harness plan §21a)
    # get the same checks on every push, without a standing pull request.
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

# The run is split into parallel jobs (stability plan R10): until 2026-11 it was
# one job of about 110 minutes, 67 of them the E2E suite with one worker
# against the dev server. Branch protection requires four check names; three
# come from this file and keep their meaning:
#   - "Checks" is the gate at the end: green only when every job it needs
#     succeeded (see the job for why that is written out);
#   - "WebKit editor regression" and "Rust checks" are jobs of their own, as before.
# Each job's steps are what the one job did, in the same order.
#
# Room for the performance budgets: they come as a workflow of their own
# (.github/workflows/perf.yml), not as jobs here.

permissions:
  contents: read

jobs:
  # Decision E3: `main` takes only fast-forwards of commits whose required
  # checks are already green, and check runs belong to the commit. A run on
  # `main` for such a commit skips everything below; any other commit — and
  # every branch, pull request and rerun that finds the checks not green —
  # runs in full (apps/desktop/scripts/ci-verified.mjs).
  verified:
    name: Already verified
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      verified: ${{ steps.ask.outputs.verified }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Are the required checks already green on this commit?
        id: ask
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/ci-verified.mjs

  static:
    name: Lint, typecheck and scans
    needs: verified
    if: needs.verified.outputs.verified != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret Scanning (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scanners: 'secret'
          hide-progress: false
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true

      - name: npm audit (production dependencies)
        # npm retired the v1 audit endpoint (HTTP 410, July 2026) that `pnpm audit`
        # calls, so this step can no longer reach the registry. Keep it
        # non-blocking — Dependabot security alerts already cover npm advisories,
        # and cargo-audit + CodeQL still gate the rest. Re-tighten once pnpm uses
        # the bulk advisory endpoint.
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The skills Plainva ships and documents, checked by the Agent Skills
      # format's own reference validator (plan KI-Harness P3-3). It is a
      # demonstration package: pinned to one commit, its four dependencies to
      # exact versions, nothing else installed, and it runs only here.
      - name: Agent Skills reference validation
        env:
          SKILLS_REF_COMMIT: 69ef37e9424c0a7ea9dd2293b559e43ec8176379
        run: |
          curl -sSfL "https://codeload.github.com/agentskills/agentskills/tar.gz/$SKILLS_REF_COMMIT" | tar -xz -C "$RUNNER_TEMP"
          python3 -m pip install --quiet --no-deps --target "$RUNNER_TEMP/skills-ref-deps" click==8.3.1 strictyaml==1.7.3 python-dateutil==2.9.0.post0 six==1.17.0
          export PYTHONPATH="$RUNNER_TEMP/agentskills-$SKILLS_REF_COMMIT/skills-ref/src:$RUNNER_TEMP/skills-ref-deps"
          for skill in packages/ui/src/ai/skills/*/ docs/agents/skills/*/; do
            python3 -c 'from skills_ref.cli import main; main()' validate "$skill"
          done

  unit:
    name: Unit tests (${{ matrix.name }})
    needs: verified
    if: needs.verified.outputs.verified != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            run: pnpm --filter @plainva/core test
          # The desktop suite is the longest (16 minutes alone): two halves.
          - name: desktop 1/2
            run: pnpm --filter desktop exec vitest run --shard=1/2
          - name: desktop 2/2
            run: pnpm --filter desktop exec vitest run --shard=2/2
          # The mobile vitest suite (navigation reducer, save coordinator, dialogs,
          # pull-to-refresh, structure ratchet) previously ran only in the local
          # pre-push hook — a push without hooks had no mobile test coverage.
          - name: mobile
            run: pnpm --filter mobile test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests
        run: ${{ matrix.run }}

  build:
    name: Build and production smokes
    needs: verified
    if: needs.verified.outputs.verified != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Desktop web build
        run: pnpm --filter desktop build

      # Reads the bundle the step above produced and looks for JS the supported
      # engine floor does not have. floorConsistency.test.ts only checks what we
      # PROMISE; this checks whether the build keeps that promise — the gap that
      # issue #46 fell into. Ran manually until now, which is another way of
      # saying it ran when someone remembered.
      - name: Engine floor scan
        run: pnpm --filter desktop run scan:engine-floor

      - name: Install Playwright Browsers
        run: pnpm --filter desktop exec playwright install --with-deps chromium

      - name: Core package consumer smoke
        run: npm --prefix packages/core run smoke:package

      # Production-build smoke (v0.3.0 white-screen guard): the bundle produced
      # by "Desktop web build", exactly as it ships, served by `vite preview`;
      # asserts the app boots and renders its first screen with no uncaught
      # error. The E2E jobs below run against the e2e bundle, which is this
      # build plus the test fixtures (apps/desktop/scripts/e2e-bundle.mjs).
      - name: Production build smoke
        run: xvfb-run pnpm --filter desktop run test:e2e:prod

      # See "Upload Playwright traces" in the E2E job.
      - name: Look for Playwright traces
        id: traces
        if: always()
        run: |
          if find apps/desktop/test-results -name trace.zip 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Playwright traces
        if: failure() || steps.traces.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-build-${{ github.run_attempt }}
          path: apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.shard }}/4)
    needs: verified
    if: needs.verified.outputs.verified != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm --filter desktop exec playwright install --with-deps chromium
      # The suite runs against the built bundle, not the dev server (R10): what
      # ships, plus the fixtures a few tests import (scripts/e2e-bundle.mjs).
      - name: Build the e2e bundle
        run: pnpm --filter desktop run build:e2e
      - name: E2E tests
        env:
          E2E_BUNDLE: "1"
        run: xvfb-run pnpm --filter desktop exec playwright test --shard=${{ matrix.shard }}/4

      # A test that failed once and passed on its retry used to leave nothing
      # behind but a line in the log (E27, Befunde 2026-09-24). Every Playwright
      # config traces the FIRST run of each test in CI and keeps the trace when
      # that run fails (`trace: "retain-on-first-failure"`; until 2026-10-06 it
      # was the retry that was traced, i.e. the attempt that passed). A trace
      # exists exactly when a first attempt failed — and then the results go up
      # as an artifact, kept for a week. Open a trace with
      # `npx playwright show-trace <trace.zip>`. A green run without a retry
      # uploads nothing.
      - name: Look for Playwright traces
        id: traces
        if: always()
        run: |
          if find apps/desktop/test-results -name trace.zip 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Playwright traces
        if: failure() || steps.traces.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-${{ matrix.shard }}-${{ github.run_attempt }}
          path: apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The guard for the PHONE's production build. A dependency bump split React's
  # CommonJS shim away from react-i18next's interop call, and the mobile app
  # stopped mounting from a production build entirely while dev, unit tests and
  # the rest of CI stayed green (rework round 2). Builds the mobile bundle and
  # runs the phone's production suite against it, in two halves.
  mobile-smoke:
    name: Mobile production smoke (${{ matrix.shard }}/2)
    needs: verified
    if: needs.verified.outputs.verified != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm --filter mobile exec playwright install --with-deps chromium
      # smoke:prod builds the e2e bundle and runs the suite; the shard goes to Playwright.
      - name: Mobile production build smoke
        run: xvfb-run pnpm --filter mobile run smoke:prod --shard=${{ matrix.shard }}/2
      - name: Look for Playwright traces
        id: traces
        if: always()
        run: |
          if find apps/mobile/test-results -name trace.zip 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Playwright traces
        if: failure() || steps.traces.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-mobile-${{ matrix.shard }}-${{ github.run_attempt }}
          path: apps/mobile/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The required check "Checks": green only when every job above succeeded.
  #
  # Written out because GitHub's own rule would let a gap through: a job whose
  # `needs` failed is SKIPPED by default, and a skipped required check counts
  # as passed for branch protection. So this job runs always() — also when a
  # needed job failed, was cancelled or was skipped — and itself fails unless
  # every one of them reports `success`. The one honest skip is the E3 case:
  # the commit's required checks are already green, then this job is skipped
  # as well and the green "Checks" from the branch run stands.
  checks:
    name: Checks
    needs: [verified, static, unit, build, e2e, mobile-smoke]
    if: always() && needs.verified.outputs.verified != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Every job of the run succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            const bad = Object.entries(needs).filter(([, job]) => job.result !== "success");
            for (const [name, job] of Object.entries(needs)) console.log(`${name}: ${job.result}`);
            if (bad.length) { console.error(`Not green: ${bad.map(([n, j]) => `${n} (${j.result})`).join(", ")}`); process.exit(1); }
          '

  # The core is the part that touches a real file system, and macOS answers
  # differently from Linux there: APFS folds the composed and the decomposed
  # spelling of a name into one file. Until 2026-10 only the release workflow
  # ran anything on macOS, so that difference surfaced during release 0.8.4
  # and cost a rebuild. Not a required check until it has run quietly for a
  # while — a red macOS runner must not hold `main` on its first week.
  core-macos:
    name: Core tests (macOS)
    needs: verified
    if: needs.verified.outputs.verified != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plainva/core test

  # The desktop's Rust has code of its own for macOS (issue #135: spell
  # checking in WKWebView) that the Linux job never compiles; until 2026-10 it
  # was first compiled by a release. Not a required check yet (decision E4:
  # it becomes one once branch protection names it).
  rust-macos:
    name: Rust check (macOS)
    needs: verified
    if: needs.verified.outputs.verified != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
      # tauri::generate_context! embeds frontendDist at compile time.
      - run: mkdir -p apps/desktop/dist
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked -- -D warnings

  webkit:
    name: WebKit editor regression
    needs: verified
    if: needs.verified.outputs.verified != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop exec playwright install --with-deps webkit
      - run: pnpm --filter desktop exec playwright test --config playwright.webkit.config.ts
      # The same rule as in the E2E jobs (E27). This config keeps the trace of
      # every failed attempt, so a trace exists exactly when a test failed or
      # needed its retry.
      - name: Look for Playwright traces
        id: traces
        if: always()
        run: |
          if find apps/desktop/test-results -name trace.zip 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Playwright traces
        if: failure() || steps.traces.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-webkit-${{ github.run_attempt }}
          path: apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Rust checks
    needs: verified
    if: needs.verified.outputs.verified != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'

      # tauri::generate_context! embeds frontendDist at compile time; the web
      # build does not run in this job, so provide an empty stand-in.
      - name: Provide frontend dist stub
        run: mkdir -p apps/desktop/dist

      - name: cargo check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      # Lint gate (P5.6): warnings are errors so drift cannot accumulate.
      - name: cargo clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Reviewed 2026-09-17: quick-xml 0.41.0 (plist 1.10.0) is patched;
      # RUSTSEC-2026-0194 and RUSTSEC-2026-0195 no longer need exceptions.
      # The two entries below remain in Cargo.lock for optional SQLx backends,
      # but `cargo tree --locked --target all -i rsa` / `-i rkyv` have no active
      # dependency path with this application's SQLite feature selection.
      # Re-check enabled features and these inverse trees on every dependency
      # update; enabling a backend is not covered by these exceptions.
      #   RUSTSEC-2023-0071: `rsa` Marvin attack. No fixed upstream release exists.
      #     Pulled via sqlx-mysql (tauri-plugin-sql); this app is SQLite-only, so the
      #     MySQL auth path that would exercise RSA never runs.
      #   RUSTSEC-2026-0235: rkyv 0.7 archive-validation out-of-bounds read.
      #     The fix is on 0.8; 0.7 is unsupported. The lockfile chain is optional
      #     SQLx -> rust_decimal -> rkyv, absent from the active graph. Re-evaluate
      #     when that chain updates or archive/Decimal support is enabled.
      #   RUSTSEC-2026-0459 (reviewed 2026-11-10): the SQLite that libsqlite3-sys
      #     0.30 bundles (< 3.54) can return uninitialised page-cache memory when
      #     it opens a database together with a crafted `-wal` file of another
      #     page size. The fix is libsqlite3-sys 0.39, which needs sqlx 0.9;
      #     tauri-plugin-sql 2.x pins sqlx 0.8 and one binary cannot link two
      #     SQLites. The app opens its own index databases in its app-data
      #     folder; the one path that opens a database a third party could have
      #     written is the one-time migration of a legacy in-vault
      #     `.plainva/vault.db` (VaultContext.tsx, resolveIndexDbUrl). Local
      #     vector, user interaction needed, information disclosure into query
      #     results. Lift the exception when tauri-plugin-sql moves to sqlx 0.9.
      - name: cargo audit
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0235 --ignore RUSTSEC-2026-0459
