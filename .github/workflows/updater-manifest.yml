name: Updater manifest

# Copies `latest.json` of a published desktop release to a FIXED location that
# no release label can move:
#
#   https://github.com/plainva/plainva/releases/download/updater/latest.json
#
# Why this exists: the in-app updater used to fetch the manifest from
# `releases/latest/download/latest.json`, i.e. from whichever release GitHub
# labels "Latest". That label is a UI property — a mobile release published
# without the `prerelease` flag, a hotfix re-marked by hand, or a single commit
# that drops the flag in release-mobile.yml would have pointed `latest` at a
# release that carries no `latest.json`, and every desktop install would have
# stopped updating without any error anyone sees. The fixed path is served
# from a permanent pre-release named `updater` whose only asset is this file;
# the app reads it first and keeps the label path only as a fallback for
# repairs (see apps/desktop/src-tauri/tauri.conf.json and
# apps/desktop/src/updaterEndpoint.test.ts).
#
# When it runs: on every *published* release (the desktop release is created
# as a draft by release.yml and published by the maintainer, so publish time is
# the first moment the asset URLs inside the manifest resolve). Mobile tags
# (`mobile-v…`) and pre-releases are skipped. A manual run with a tag repairs
# or bootstraps the fixed manifest without cutting anything.
#
# What it waits for: the signature counter-check. The fixed manifest moves only
# when both "updater signature" jobs (Linux, Windows; native-smoke.yml, called
# by release.yml) are green in the release run started by the push of exactly
# this tag, for the commit it names (apps/desktop/scripts/updater-signature-gate.mjs,
# test apps/desktop/src/updaterSignatureGate.test.ts). Publishing the draft is
# the maintainer's hand and nothing in release.yml orders it after the smoke,
# so the jobs may still run when this starts: it waits for them (up to 90
# minutes), never passes an unfinished one, and fails on a red or missing one.
# A rehearsal or a Windows rebuild (both workflow_dispatch) never counts as the
# evidence. A repair run may go without the check only with
# `without_signature_check` and a `reason`; the run says so in a warning and in
# its summary. `requireSignedVersion` and the manifest check below stay as they
# are.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Desktop release tag to copy the manifest from (e.g. v0.8.0)'
        required: true
      without_signature_check:
        description: 'Repair only: copy without a green updater signature check in the tag''s release run (needs a reason; shown as a warning)'
        type: boolean
        default: false
      reason:
        description: 'Why the signature check is skipped (required with without_signature_check)'
        type: string
        default: ''

permissions:
  contents: write
  actions: read

# One run at a time for the one fixed manifest: a run that waits for the
# signature check (up to 90 minutes) and a repair run never overtake each
# other, and an older run never rewrites the manifest after a newer one.
# Never cancelled: a run in progress always finishes. (GitHub keeps one run
# queued behind it per group and cancels an older queued one for a newer:
# start a repair run only when no other manifest run is queued, or that one
# is lost and must be started again.)
concurrency:
  group: updater-manifest
  cancel-in-progress: false

jobs:
  copy-manifest:
    runs-on: ubuntu-latest
    # Up to 90 minutes of it is the wait for the signature check.
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FIXED_TAG: updater
    steps:
      - name: Resolve the source release
        id: src
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
          EVENT_DRAFT: ${{ github.event.release.draft }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$EVENT_TAG}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Only coordinated desktop releases carry a manifest: vX.Y.Z, nothing
          # else. `mobile-v…` and the `updater` release itself must never feed
          # this step (the latter would copy the file onto itself).
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag is not a desktop release tag — nothing to copy."
            exit 0
          fi
          if [ "${EVENT_PRERELEASE:-false}" = "true" ] || [ "${EVENT_DRAFT:-false}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag is a draft or pre-release — the fixed manifest stays on the last stable release."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # The check script and the app's key from the default branch: the key
      # the installs in the field trust, and a check that also covers a
      # repair run for an older tag.
      - uses: actions/checkout@v7
        if: steps.src.outputs.skip == 'false'
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            apps/desktop/scripts
            apps/desktop/src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false

      - name: The updater signature check of this release is green
        if: steps.src.outputs.skip == 'false'
        env:
          RELEASE_TAG: ${{ steps.src.outputs.tag }}
          WITHOUT_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.without_signature_check }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [ "$WITHOUT_CHECK" = "true" ]; then
            # The reason is typed by hand: one line, and `%` escaped, so it
            # can never start a workflow command of its own (a newline would
            # put "::stop-commands::…" at the start of the next line).
            reason="$(printf '%s' "$REASON" | tr '\r\n\t' '   ')"
            if [ -z "${reason//[[:space:]]/}" ]; then
              echo "::error::without_signature_check needs a reason"
              exit 1
            fi
            echo "::warning::$RELEASE_TAG: the manifest is copied WITHOUT a green updater signature check (repair run). Reason: ${reason//%/%25}"
            echo "**$RELEASE_TAG: copied without the updater signature check** (repair run by ${GITHUB_ACTOR}). Reason: $reason" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node apps/desktop/scripts/updater-signature-gate.mjs

      - name: Download the manifest of that release
        if: steps.src.outputs.skip == 'false'
        run: |
          set -euo pipefail
          rm -f latest.json
          gh release download "${{ steps.src.outputs.tag }}" --pattern latest.json --dir .
          test -s latest.json
          expected="${{ steps.src.outputs.tag }}"
          expected="${expected#v}"
          # Everything an install will check of it, before it reaches the
          # fixed address: the version, the expected platform set, https
          # release-asset URLs, every signature made with the app's key and
          # bound to this version (`requireSignedVersion`). One script, with
          # its unit test (apps/desktop/src/updaterManifestCheck.test.ts).
          node apps/desktop/scripts/updater-manifest-check.mjs latest.json "$expected"

      - name: Ensure the fixed release exists
        if: steps.src.outputs.skip == 'false'
        run: |
          set -euo pipefail
          if gh release view "$FIXED_TAG" >/dev/null 2>&1; then
            echo "Release '$FIXED_TAG' exists."
          else
            # A pre-release so that it can never become "Latest" itself, and
            # never a draft: draft assets are not publicly downloadable.
            # The notes are built with printf: a heredoc terminator would have to
            # sit at column 0, which ends this YAML block scalar (measured: the
            # first version of this file failed to parse for exactly that).
            printf '%s\n' \
              'This release holds exactly one file, `latest.json`, at a fixed address that the desktop app'"'"'s built-in updater reads:' \
              '' \
              '`https://github.com/plainva/plainva/releases/download/updater/latest.json`' \
              '' \
              'It is rewritten automatically by the **Updater manifest** workflow every time a desktop release (`vX.Y.Z`) is published. It is not a release of Plainva - install the app from the newest `Plainva vX.Y.Z` release or from https://plainva.com.' \
              > updater-notes.md
            gh release create "$FIXED_TAG" \
              --target "${{ github.sha }}" \
              --prerelease \
              --title "Desktop update manifest" \
              --notes-file updater-notes.md
          fi

      - name: Upload the manifest to the fixed location
        if: steps.src.outputs.skip == 'false'
        run: |
          set -euo pipefail
          gh release upload "$FIXED_TAG" latest.json --clobber

      - name: Verify the fixed endpoint serves the new version
        if: steps.src.outputs.skip == 'false'
        run: |
          set -euo pipefail
          url="https://github.com/${GH_REPO}/releases/download/${FIXED_TAG}/latest.json"
          expected="${{ steps.src.outputs.tag }}"
          expected="${expected#v}"
          # The CDN behind release assets can lag a few seconds after an upload.
          for attempt in 1 2 3 4 5 6; do
            served=$(curl -fsSL "$url" | jq -r .version || true)
            if [ "$served" = "$expected" ]; then
              echo "$url serves version $served."
              exit 0
            fi
            echo "attempt $attempt: endpoint serves '${served:-nothing}', waiting for $expected"
            sleep 10
          done
          echo "::error::$url does not serve $expected after the upload"
          exit 1
