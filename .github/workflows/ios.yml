# iOS shell (P7): compile check on every dispatch, TestFlight upload on
# demand. The compile job needs NO signing or Apple account — it proves the
# Swift plugins and the Capacitor SPM setup build. The TestFlight job is
# gated behind an input and requires these repository secrets:
#   IOS_CERTIFICATE_P12_BASE64    - Apple Distribution certificate (.p12, base64)
#   IOS_CERTIFICATE_PASSWORD      - password of that .p12
#   IOS_PROVISIONING_PROFILE_BASE64 - App Store profile for com.plainva.app + App Group
#   IOS_SHARE_PROVISIONING_PROFILE_BASE64 - separate com.plainva.app.share profile + App Group
#   IOS_WIDGETS_PROVISIONING_PROFILE_BASE64 - separate com.plainva.app.widgets profile + App Group.
#     Optional until the widgets target exists (plan Widgets, W4); the guide to creating it
#     is in the maintainer's notes, iOS_Widgets_Signierung_2026-09-23.
#   APP_STORE_CONNECT_KEY_ID      - App Store Connect API key id
#   APP_STORE_CONNECT_ISSUER_ID   - App Store Connect issuer id
#   APP_STORE_CONNECT_KEY_BASE64  - the .p8 API key (base64)
name: iOS

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload to TestFlight (requires signing secrets)"
        type: boolean
        default: false
      public_group:
        description: "Also add the build to the beta group with the public TestFlight link"
        type: boolean
        default: false

# Shown under About & diagnostics (scripts/build-info.mjs).
env:
  PLAINVA_BUILD_CHANNEL: release

jobs:
  build:
    name: Simulator build (no signing)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm --filter mobile build
        env:
          VITE_PLAINVA_GOOGLE_MAIL_STATE: ${{ vars.VITE_PLAINVA_GOOGLE_MAIL_STATE }}
          VITE_PLAINVA_GOOGLE_IOS_CLIENT_ID: ${{ vars.VITE_PLAINVA_GOOGLE_IOS_CLIENT_ID }}

      - name: Sync Capacitor iOS
        working-directory: apps/mobile
        run: npx cap sync ios

      - name: Test durable share queue
        working-directory: apps/mobile/ios/App
        run: |
          swiftc Shared/ShareQueueStore.swift tests/ShareQueueTests.swift -o "$RUNNER_TEMP/share-queue-tests"
          "$RUNNER_TEMP/share-queue-tests"

      # The same idea for the widgets (plan Widgets, W4): the Swift there
      # carries real rules - which day it is, how much is overdue by now,
      # whether an order still names a row - and a simulator build only proves
      # that it compiles.
      - name: Test the widget snapshot and its store
        working-directory: apps/mobile/ios/App
        run: |
          swiftc Shared/WidgetStore.swift PlainvaWidgets/WidgetModel.swift tests/WidgetStoreTests.swift -o "$RUNNER_TEMP/widget-store-tests"
          "$RUNNER_TEMP/widget-store-tests"

      - name: Build for simulator
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  testflight:
    name: TestFlight upload
    needs: build
    if: ${{ inputs.testflight }}
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Only commits on main may reach the store app com.plainva.app — a build
      # from a feature branch goes through labs-mobile.yml into "Plainva Labs"
      # (harness plan §21a.4 no. 5). Before this, any ref uploaded here. The
      # compare API answers without fetching history: "identical" or "behind"
      # means the commit is part of main.
      - name: Refuse commits that are not on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq .status)"
          echo "compare main...${GITHUB_SHA}: $status"
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "::error::${GITHUB_SHA} is not on main. Store uploads come only from main; build branch states with labs-mobile.yml."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm --filter mobile build
        env:
          VITE_PLAINVA_GOOGLE_MAIL_STATE: ${{ vars.VITE_PLAINVA_GOOGLE_MAIL_STATE }}
          VITE_PLAINVA_GOOGLE_IOS_CLIENT_ID: ${{ vars.VITE_PLAINVA_GOOGLE_IOS_CLIENT_ID }}

      - name: Sync Capacitor iOS
        working-directory: apps/mobile
        run: npx cap sync ios

      - name: Import signing certificate and profiles
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          SHARE_PROFILE_B64: ${{ secrets.IOS_SHARE_PROVISIONING_PROFILE_BASE64 }}
          WIDGETS_PROFILE_B64: ${{ secrets.IOS_WIDGETS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$CERT_B64" ] || [ -z "$PROFILE_B64" ] || [ -z "$SHARE_PROFILE_B64" ]; then
            echo "::error::Signing secrets are not configured (see the header of this workflow)."
            exit 1
          fi
          # Since the widget target exists (plan Widgets, W4) the archive
          # contains a third bundle, and a bundle cannot be signed without its
          # profile. Said here, in ten seconds and in a sentence, rather than
          # fifteen minutes later as an xcodebuild signing error.
          if [ -z "$WIDGETS_PROFILE_B64" ]; then
            echo "::error::IOS_WIDGETS_PROVISIONING_PROFILE_BASE64 is not configured, and the PlainvaWidgets target cannot be signed without it. Create the app id com.plainva.app.widgets with the App Group group.com.plainva.app and an App Store profile, then store it as that secret - the three steps are written up in the maintainer's notes (iOS_Widgets_Signierung_2026-09-23)."
            exit 1
          fi
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/plainva.mobileprovision
          echo "$SHARE_PROFILE_B64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/plainva-share.mobileprovision
          # The widgets profile is optional until its target exists; an empty
          # third argument leaves the check exactly where it was.
          WIDGETS_PROFILE=""
          if [ -n "$WIDGETS_PROFILE_B64" ]; then
            WIDGETS_PROFILE=~/Library/MobileDevice/Provisioning\ Profiles/plainva-widgets.mobileprovision
            echo "$WIDGETS_PROFILE_B64" | base64 --decode > "$WIDGETS_PROFILE"
            echo "PLAINVA_EXPECT_WIDGETS=1" >> "$GITHUB_ENV"
          fi
          python3 apps/mobile/scripts/install-ios-profiles.py \
            ~/Library/MobileDevice/Provisioning\ Profiles/plainva.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/plainva-share.mobileprovision \
            "$WIDGETS_PROFILE"

      - name: Prepare App Store Connect API key
        env:
          ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_B64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Archive
        working-directory: apps/mobile/ios/App
        # CURRENT_PROJECT_VERSION = the monotonic workflow run number, so every
        # upload gets a unique, increasing build number (App Store Connect
        # rejects a re-used one). MARKETING_VERSION (1.0) stays the user-facing
        # version; bump it in the pbxproj for a real release.
        run: |
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            PLAINVA_APP_PROFILE="$PLAINVA_APP_PROFILE" \
            PLAINVA_SHARE_PROFILE="$PLAINVA_SHARE_PROFILE" \
            PLAINVA_WIDGETS_PROFILE="$PLAINVA_WIDGETS_PROFILE"

      - name: Export and upload to TestFlight
        working-directory: apps/mobile/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          python3 ../../scripts/verify-ios-share-archive.py "$RUNNER_TEMP/App.xcarchive" "$RUNNER_TEMP/export.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8

      # "What to Test" for this build, from the same catalog the app's What's
      # New dialog reads (apps/mobile/scripts/store-whatsnew.mjs). App Store
      # Connect needs a few minutes to process the upload before the build
      # exists as an object; the script waits for that, then writes one
      # localisation per language. With `public_group` it also hands the build
      # to the group behind the public TestFlight link — opt-in, because an
      # interim build is for the maintainer's devices, not for everyone.
      - name: Store release notes from the What's New catalog
        run: node apps/mobile/scripts/store-whatsnew.mjs "$RUNNER_TEMP/whatsnew"

      - name: What to Test on TestFlight
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          node apps/mobile/scripts/testflight-what-to-test.mjs "$RUNNER_TEMP/whatsnew" \
            ${{ inputs.public_group && '--public-group' || '' }}
