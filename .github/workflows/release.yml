name: Release
on:
  push:
    tags:
      - 'v*'
  # Manual trigger to dry-run the pre-flight (lint + full test suite) on all
  # three platforms without cutting a release. The macOS leg of `pnpm test`
  # exercises the recursive fs.watch path (FSEvents), which the ubuntu-only CI
  # workflow never runs — this is the on-demand way to confirm that path stays
  # green. Ordinary manual runs do not create or upload release artifacts, and
  # they are the only runs that still execute the unit suite here: a release
  # trusts the CI of its commit instead (job `release-gate`).
  # An explicit rebuild_windows_tag recovers only Windows artifacts in an
  # existing unpublished draft, using its original immutable source tag.
  #
  # `linux_appimage` additionally builds the Linux AppImage on the ubuntu leg and
  # attaches it as a workflow artifact — no draft release, nothing published.
  # This exists because the AppImage cannot be verified here: the blank window
  # on Mesa-25 hosts (issue #85) only shows on a distribution newer than the
  # runner, so a reporter has to try the build. A tag would create a draft
  # release named after a branch; an artifact is the honest shape of a test.
  #
  # `rehearsal` builds, signs and notarizes the three release legs exactly like
  # a tag push and publishes nothing — see the job `rehearsal` at the end.
  # Run it on the release branch before the tag, so it builds the version the
  # tag will build: gh workflow run Release --ref <branch> -f rehearsal=true
  workflow_dispatch:
    inputs:
      linux_appimage:
        description: 'Also build the Linux AppImage and attach it as an artifact (no release)'
        type: boolean
        default: false
      rebuild_windows_tag:
        description: 'Rebuild Windows for an existing unpublished draft (exact vX.Y.Z tag; empty means dry-run)'
        type: string
        default: ''
      rehearsal:
        description: 'Release rehearsal: build, sign and notarize all three installers exactly like a release, publish nothing (no draft, no manifest, no asset)'
        type: boolean
        default: false

# A rerun for the same tag must not race another draft allocation.
concurrency:
  group: desktop-release-${{ inputs.rebuild_windows_tag && format('refs/tags/{0}', inputs.rebuild_windows_tag) || github.ref }}
  cancel-in-progress: false

# Shown under About & diagnostics (scripts/build-info.mjs).
env:
  PLAINVA_BUILD_CHANNEL: release

jobs:
  # The release builds a commit main has taken, and nothing else (Sammelplan
  # § 3.149). Until 0.8.6 every platform leg ran the full unit suite again —
  # about 50 minutes on Windows, twice past the job's limit before the app was
  # built — although the same commit had to pass CI to be on main. Now the gate
  # asks GitHub instead: the tag's commit lies on main, and the four checks
  # branch protection requires ("Checks", "WebKit editor regression", "Rust
  # checks", "Analyze (JavaScript/TypeScript)") passed on exactly that commit.
  # If not, nothing else starts. A Windows rebuild of a draft is held to the
  # same rule for its tag. Read-only token.
  release-gate:
    name: Release gate
    if: github.event_name != 'workflow_dispatch' || inputs.rebuild_windows_tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      source_sha: ${{ steps.gate.outputs.source_sha }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The tag's commit is on main and its required checks are green
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.rebuild_windows_tag || github.ref_name }}
          # A tag push builds the commit it was started for; a Windows rebuild
          # runs from the workflow's revision and resolves its tag by itself.
          EXPECTED_SHA: ${{ !inputs.rebuild_windows_tag && github.sha || '' }}
        run: node apps/desktop/scripts/release-gate.mjs

  prepare:
    if: github.event_name != 'workflow_dispatch' || inputs.rebuild_windows_tag
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
      release_tag: ${{ steps.draft.outputs.release_tag }}
      source_sha: ${{ steps.draft.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout the original release source for a Windows rebuild
        if: inputs.rebuild_windows_tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.rebuild_windows_tag }}
          path: release-source
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Prepare one draft for every platform
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_WINDOWS_TAG: ${{ inputs.rebuild_windows_tag }}
        run: node apps/desktop/scripts/prepare-release.mjs

  # The native smoke on the three systems, parallel to the build legs (it adds
  # no time before the Windows leg, which alone takes over an hour). A red
  # Linux or Windows smoke turns the release run red. macOS is on probation
  # until its smoke has been green five runs in a row: it runs and its result
  # goes into the release record, but it does not stop the release
  # (docs/engineering/Release_Gate_Checklist.md). A Windows rebuild of an
  # existing draft does not run it again.
  native-smoke:
    needs: release-gate
    # A manual dry run has no gate (it releases nothing) and smokes all the same.
    if: ${{ !cancelled() && !inputs.rebuild_windows_tag && (needs.release-gate.result == 'success' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
    uses: ./.github/workflows/native-smoke.yml
    with:
      macos_may_fail: true

  release:
    needs: prepare
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && !inputs.rebuild_windows_tag && !inputs.rehearsal) || needs.prepare.result == 'success') }}
    # Every platform uploads to the same previously allocated draft ID.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ inputs.rebuild_windows_tag && fromJSON('["windows-latest"]') || fromJSON('["macos-latest", "ubuntu-22.04", "windows-latest"]') }}
    runs-on: ${{ matrix.platform }}
    # Guard against a hung notarization: notarytool --wait can block for hours,
    # so cap the job — a stuck build fails in 2h instead of the 6h ceiling. One
    # hour was too short for Windows while it still ran the unit suite first
    # (53 minutes for 0.8.6); a release no longer does (`release-gate`), and the
    # cap stays for the manual dry run, which still does.
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha || github.sha }}

      - name: Verify the exact build source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Checkout does not match the prepared source"
            exit 1
          fi
          echo "Verified build source $actual"

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Test Pre-flight (manual dry run only)
        # A release does not run the suite again: its commit passed it in CI
        # before main took it, and `release-gate` checked exactly that. A
        # manual dry run still does, on all three systems (the macOS FSEvents
        # path above). Suite-level and per-suite workers otherwise compete on
        # small runners; keep all assertions and timeouts.
        if: github.event_name == 'workflow_dispatch' && !inputs.rebuild_windows_tag
        env:
          PLAINVA_TEST_WORKERS: 1
        run: |
          pnpm lint
          pnpm exec turbo run test --concurrency=1

      # Production-build smoke before we cut installers (v0.3.0 shipped a
      # production-only white-screen). Run once on Linux: the web bundle under
      # test is OS-independent and the check runs in Playwright's Chromium, not
      # the platform webview, so a single leg covers all three installers.
      - name: Install Playwright Browsers (smoke)
        if: matrix.platform == 'ubuntu-22.04' && github.event_name != 'workflow_dispatch'
        run: pnpm --filter desktop exec playwright install --with-deps chromium

      - name: Production build smoke
        if: matrix.platform == 'ubuntu-22.04' && github.event_name != 'workflow_dispatch'
        run: xvfb-run pnpm --filter desktop run smoke:prod

      # Windows code-signing (Azure Artifact Signing, account plainva-signing /
      # profile plainva in North Europe). Tauri invokes this tool through the
      # signCommand in tauri.signing.conf.json, so it has to be on PATH before the
      # bundler runs. `cargo install` compiles it (a few minutes); that only costs
      # time on an actual release, hence the same workflow_dispatch gate as the
      # build below. If the wait ever grates, cache ~/.cargo/bin or pull a
      # prebuilt binary instead.
      - name: Install Azure signing tool (windows only)
        if: matrix.platform == 'windows-latest' && (github.event_name != 'workflow_dispatch' || inputs.rebuild_windows_tag)
        run: cargo install artifact-signing-cli --locked

      - name: Load the versioned release notes
        if: github.event_name != 'workflow_dispatch' || inputs.rebuild_windows_tag
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Expected a coordinated desktop release tag');
          for (const path of ['apps/desktop/package.json', 'apps/mobile/package.json', 'apps/desktop/src-tauri/tauri.conf.json']) {
            if (JSON.parse(readFileSync(path, 'utf8')).version !== tag.slice(1)) throw new Error(`Version mismatch: ${path}`);
          }
          const body = readFileSync(`docs/releases/${tag}.md`, 'utf8');
          if (!body.trim()) throw new Error('Release notes are empty');
          appendFileSync(process.env.GITHUB_OUTPUT, `body<<PLAINVA_RELEASE_NOTES\n${body}\nPLAINVA_RELEASE_NOTES\n`);
          NODE

      # The ONNX Runtime the app bundles for local embeddings (plan KI-Harness P2a-3,
      # ADR 0021): Microsoft's release archives, pinned by size and SHA-256 in the script.
      # macOS joins the arm64 library of 1.30 and the x86_64 one of 1.23.2 with lipo.
      - name: Fetch ONNX Runtime
        run: node apps/desktop/scripts/fetch-onnxruntime.mjs

      - name: Build Tauri App
        # Tag pushes allocate a draft; explicit Windows recovery only reuses
        # the draft and exact source validated by the prepare job.
        if: github.event_name != 'workflow_dispatch' || inputs.rebuild_windows_tag
        # tauri-action v1 (migrated from v0). The inputs we use (tagName,
        # releaseName, releaseBody, releaseDraft, prerelease, args) are unchanged;
        # v1 only drops includeRelease/includeDebug/auto-init and renames
        # assetNamePattern (none of which we set). Note: v1's latest.json uses the
        # GitHub asset URL instead of browser_download_url — verified against a
        # throwaway pre-release so the in-app updater still resolves.
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code-signing (Developer ID Application, team M3FGXPBLFZ): tauri-action
          # imports the base64 .p12 from APPLE_CERTIFICATE and signs the app. Only runs on
          # a tag push; manual Windows recovery never runs the macOS leg.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Notarization (re-enabled for 0.4.1): notarytool --wait submits the signed
          # app to Apple and staples the ticket, so macOS opens it without the
          # right-click -> Open dance. It hung on Apple's service during the 0.4.0 cut;
          # the 60-minute job cap above bounds a repeat hang. If it stalls again,
          # comment these two out for a signed-but-not-notarized build.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # Windows code-signing: artifact-signing-cli reads these three itself.
          # They are harmless on the macOS and Linux legs, which never invoke it.
          # The client secret expires 2028-08-11 and the identity validation behind
          # the certificate profile on 2028-10-23 — both fail this build silently
          # late rather than loudly now.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # Plainva's own Google client for the desktop (docs/engineering/Google_Mail.md),
          # read by Vite in tauri's beforeBuildCommand. Unset leaves the standard
          # sign-in out of the build ("not included"), exactly as before. The ID
          # and the mail state are repository variables like in the mobile
          # workflows; the Desktop client's secret is not confidential to Google
          # (an installed app) and ends up in the bundle, but it lives in
          # `secrets.` so that it stays masked in the logs.
          VITE_PLAINVA_GOOGLE_MAIL_STATE: ${{ vars.VITE_PLAINVA_GOOGLE_MAIL_STATE }}
          VITE_PLAINVA_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.VITE_PLAINVA_GOOGLE_DESKTOP_CLIENT_ID }}
          VITE_PLAINVA_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.VITE_PLAINVA_GOOGLE_DESKTOP_CLIENT_SECRET }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.release_tag }}
          releaseName: 'Plainva ${{ needs.prepare.outputs.release_tag }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # The signing config is a separate file loaded only on the Windows leg, so
          # local builds and outside contributors never trip over a signCommand they
          # cannot run. The path is relative to the REPOSITORY ROOT, not to the app
          # directory: tauri-action finds apps/desktop itself but runs the CLI from
          # the workspace root. The first 0.6.3 build failed here with "Provided
          # config path D:\a\plainva\plainva\src-tauri\... does not exist", which is
          # exactly that base directory — measured, not assumed.
          args: >-
            ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin --config apps/desktop/src-tauri/tauri.onnxruntime.macos.conf.json'
            || (matrix.platform == 'windows-latest' && '--config apps/desktop/src-tauri/tauri.signing.conf.json --config apps/desktop/src-tauri/tauri.onnxruntime.conf.json' || '--config apps/desktop/src-tauri/tauri.onnxruntime.conf.json') }}

      # The embedded WebDriver server of the native smoke (a full remote control
      # of the app on a local port) is compiled in only by the smoke build's
      # cargo feature. src/webdriverSmokeIsolation.test.ts reads the sources;
      # this reads what was built, on every leg, and stops the release if the
      # server got in. The native-smoke workflow runs the same script on its
      # smoke build as the positive control, so a check that cannot see the
      # server would be noticed there.
      - name: No embedded WebDriver server in the release binary
        if: github.event_name != 'workflow_dispatch' || inputs.rebuild_windows_tag
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            macos-latest) binaries=(apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app/Contents/MacOS/*) ;;
            windows-latest) binaries=(apps/desktop/src-tauri/target/release/plainva-desktop.exe) ;;
            *) binaries=(apps/desktop/src-tauri/target/release/plainva-desktop) ;;
          esac
          bash apps/desktop/scripts/check-webdriver-server.sh "${binaries[@]}"

      # Manual AppImage test build (see the workflow_dispatch input above). Uses
      # the same signing key as a release so `createUpdaterArtifacts` does not
      # refuse the build; the signature goes nowhere — no manifest is written.
      - name: Build Linux AppImage (manual test build)
        if: matrix.platform == 'ubuntu-22.04' && github.event_name == 'workflow_dispatch' && inputs.linux_appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The same Google client as the release build above.
          VITE_PLAINVA_GOOGLE_MAIL_STATE: ${{ vars.VITE_PLAINVA_GOOGLE_MAIL_STATE }}
          VITE_PLAINVA_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.VITE_PLAINVA_GOOGLE_DESKTOP_CLIENT_ID }}
          VITE_PLAINVA_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.VITE_PLAINVA_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: pnpm --filter desktop tauri build --bundles appimage --config src-tauri/tauri.onnxruntime.conf.json

      # Measure every AppImage we build (release or test): extract it, assert
      # the binary and AppRun are there, and list the infrastructure libraries
      # the bundler swept in. That list is the evidence behind the start-up
      # workaround in src-tauri/src/linux_appimage.rs (issue #85): while a
      # bundled libwayland-client is in it, the workaround is live; the day the
      # list is empty, the workaround can go. Measured, not remembered.
      - name: Check the Linux AppImage
        if: matrix.platform == 'ubuntu-22.04' && (github.event_name != 'workflow_dispatch' || inputs.linux_appimage)
        run: |
          set -euo pipefail
          appimage="$(ls apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage | head -n 1)"
          bash apps/desktop/scripts/check-appimage.sh "$appimage"

      - name: Upload the Linux AppImage (manual test build)
        if: matrix.platform == 'ubuntu-22.04' && github.event_name == 'workflow_dispatch' && inputs.linux_appimage
        uses: actions/upload-artifact@v7
        with:
          name: plainva-appimage-${{ github.sha }}
          path: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

      # Guard against the one signing failure that passes every check on the day
      # it happens and breaks days later for every user: a signature without a
      # timestamp. Azure Trusted Signing hands out short-lived certificates — the
      # 0.6.7 signer expired the day after the cut, and the 0.6.6 signer was
      # already expired when it was measured on 2026-08-18. Both stayed Valid
      # solely because they carry an RFC 3161 timestamp. The timestamp comes from
      # the service rather than from a flag we pass, so nothing here can forget
      # it — but nothing asserted it either, and a checklist item that a human
      # runs after the fact is not a guard. This fails the release cut instead.
      # It also covers the application binary, not just the installers: that is
      # the one users execute, and whether it was signed had been an open
      # question since 0.6.6 (it is — proven at 0.6.7 by extracting the NSIS
      # archive). The binary is taken OUT of the MSI for that, because the copy
      # left in target/release is never signed; pointing at it failed the 0.6.8
      # cut on a file that is not shipped.
      - name: Verify Windows signatures carry a timestamp
        if: matrix.platform == 'windows-latest' && (github.event_name != 'workflow_dispatch' || inputs.rebuild_windows_tag)
        shell: pwsh
        run: ./apps/desktop/scripts/verify-windows-signatures.ps1

  # Release rehearsal (manual input `rehearsal`): the three release legs exactly
  # as a tag push builds them — ONNX Runtime fetched and bundled, the Windows
  # installers signed through Azure with the MCP helper inside, the universal
  # macOS app signed with the Developer ID and notarized, the updater
  # signatures made — and then every check a release runs on what it built.
  # It exists because a release with a new native part (0.9.0: the MCP helper,
  # ONNX on macOS) would otherwise meet its first real build on the release tag.
  #
  # What it can never do, by construction rather than by care:
  # - its token is read-only (`contents: read`), so it cannot create a release,
  #   a draft, a tag or an asset even if a step tried;
  # - it calls the Tauri CLI directly instead of tauri-action, and no step gets
  #   GITHUB_TOKEN: nothing here talks to the releases API, and no
  #   latest.json is written (only tauri-action writes one);
  # - `release-gate` and `prepare` stay skipped for a manual run, so no draft
  #   is allocated, and the `release` job is skipped for a rehearsal;
  # - the installers are NOT uploaded as workflow artifacts: on a public
  #   repository those are downloadable by anyone signed in to GitHub, and a
  #   signed installer of an unreleased version is a release in all but name.
  #   The run leaves only its log and the step summary (names, sizes, SHA-256,
  #   signature results).
  # Apple keeps a record of the notarization, as for every signed build.
  rehearsal:
    name: Release rehearsal
    if: github.event_name == 'workflow_dispatch' && inputs.rehearsal
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    steps:
      - name: A rehearsal is not a Windows rebuild
        if: inputs.rebuild_windows_tag
        run: |
          echo "::error::rehearsal and rebuild_windows_tag exclude each other"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers (smoke)
        if: matrix.platform == 'ubuntu-22.04'
        run: pnpm --filter desktop exec playwright install --with-deps chromium

      - name: Production build smoke
        if: matrix.platform == 'ubuntu-22.04'
        run: xvfb-run pnpm --filter desktop run smoke:prod

      - name: Install Azure signing tool (windows only)
        if: matrix.platform == 'windows-latest'
        run: cargo install artifact-signing-cli --locked

      - name: Fetch ONNX Runtime
        run: node apps/desktop/scripts/fetch-onnxruntime.mjs

      # The same configuration overlays and secrets as the release legs above,
      # given to the Tauri CLI from apps/desktop (hence `src-tauri/…`).
      - name: Build, sign and notarize (nothing is uploaded)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          VITE_PLAINVA_GOOGLE_MAIL_STATE: ${{ vars.VITE_PLAINVA_GOOGLE_MAIL_STATE }}
          VITE_PLAINVA_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.VITE_PLAINVA_GOOGLE_DESKTOP_CLIENT_ID }}
          VITE_PLAINVA_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.VITE_PLAINVA_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            macos-latest) pnpm --filter desktop tauri build --target universal-apple-darwin --config src-tauri/tauri.onnxruntime.macos.conf.json ;;
            windows-latest) pnpm --filter desktop tauri build --config src-tauri/tauri.signing.conf.json --config src-tauri/tauri.onnxruntime.conf.json ;;
            *) pnpm --filter desktop tauri build --config src-tauri/tauri.onnxruntime.conf.json ;;
          esac

      - name: No embedded WebDriver server in the release binary
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            macos-latest) binaries=(apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app/Contents/MacOS/*) ;;
            windows-latest) binaries=(apps/desktop/src-tauri/target/release/plainva-desktop.exe) ;;
            *) binaries=(apps/desktop/src-tauri/target/release/plainva-desktop) ;;
          esac
          bash apps/desktop/scripts/check-webdriver-server.sh "${binaries[@]}"

      - name: Verify Windows signatures carry a timestamp
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./apps/desktop/scripts/verify-windows-signatures.ps1

      # macOS: the app, the MCP helper and the bundled ONNX Runtime are signed,
      # the app is notarized with its ticket stapled, and both native files
      # carry both architectures of the universal build.
      - name: Verify the macOS bundle
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          app="$(ls -d apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -n 1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          for f in "$app/Contents/MacOS/plainva-mcp" "$app/Contents/Frameworks/libonnxruntime.dylib"; do
            test -f "$f" || { echo "::error::missing from the bundle: $f"; exit 1; }
            codesign --verify --strict --verbose=2 "$f"
            archs="$(lipo -archs "$f")"
            echo "$f: $archs"
            case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "::error::$f is not universal ($archs)"; exit 1 ;; esac
          done

      - name: Check the Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          appimage="$(ls apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage | head -n 1)"
          bash apps/desktop/scripts/check-appimage.sh "$appimage"

      # The record of the rehearsal: what a release would have uploaded, by
      # name, size and SHA-256 — the files themselves stay on the runner.
      - name: List what a release would have uploaded
        shell: bash
        run: |
          set -euo pipefail
          root=apps/desktop/src-tauri/target
          {
            echo "### Release rehearsal on ${{ matrix.platform }} at ${GITHUB_SHA}"
            echo
            echo '| File | Bytes | SHA-256 |'
            echo '|---|---:|---|'
            find "$root" -path '*/release/bundle/*' -type f \
              \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.tar.gz' -o -name '*.sig' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
              -not -path '*/bundle/macos/*.app/*' | sort | while read -r f; do
              if command -v sha256sum >/dev/null; then sum="$(sha256sum "$f" | cut -d' ' -f1)"; else sum="$(shasum -a 256 "$f" | cut -d' ' -f1)"; fi
              size="$(wc -c < "$f" | tr -d ' ')"
              echo "| ${f#"$root"/} | $size | \`$sum\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
