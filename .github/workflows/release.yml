name: Release
on:
  push:
    tags:
      - 'v*'
  # Manual trigger to dry-run the pre-flight (lint + full test suite) on all
  # three platforms without cutting a release. The macOS leg of `pnpm test`
  # exercises the recursive fs.watch path (FSEvents), which the ubuntu-only CI
  # workflow never runs — this is the on-demand way to confirm that path stays
  # green. The release-cutting steps below are gated off for manual runs.
  workflow_dispatch:

jobs:
  release:
    # tauri-action creates the GitHub release and uploads the installers, which
    # needs write access to repository contents. Fresh repos default to a
    # read-only GITHUB_TOKEN, so grant it explicitly here.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    # Guard against a hung notarization: notarytool --wait can block for hours,
    # so cap the job — a stuck macOS build fails in ~1h instead of the 6h ceiling.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Test Pre-flight
        run: |
          pnpm lint
          pnpm test

      # Production-build smoke before we cut installers (v0.3.0 shipped a
      # production-only white-screen). Run once on Linux: the web bundle under
      # test is OS-independent and the check runs in Playwright's Chromium, not
      # the platform webview, so a single leg covers all three installers.
      - name: Install Playwright Browsers (smoke)
        if: matrix.platform == 'ubuntu-22.04' && github.event_name != 'workflow_dispatch'
        run: pnpm --filter desktop exec playwright install --with-deps chromium

      - name: Production build smoke
        if: matrix.platform == 'ubuntu-22.04' && github.event_name != 'workflow_dispatch'
        run: xvfb-run pnpm --filter desktop run smoke:prod

      # Windows code-signing (Azure Artifact Signing, account plainva-signing /
      # profile plainva in North Europe). Tauri invokes this tool through the
      # signCommand in tauri.signing.conf.json, so it has to be on PATH before the
      # bundler runs. `cargo install` compiles it (a few minutes); that only costs
      # time on an actual release, hence the same workflow_dispatch gate as the
      # build below. If the wait ever grates, cache ~/.cargo/bin or pull a
      # prebuilt binary instead.
      - name: Install Azure signing tool (windows only)
        if: matrix.platform == 'windows-latest' && github.event_name != 'workflow_dispatch'
        run: cargo install artifact-signing-cli --locked

      - name: Build Tauri App
        # Release-cutting step: only on a tag push. A manual workflow_dispatch
        # stops after the pre-flight above, so it never builds installers or
        # creates a draft release named after the branch ref.
        if: github.event_name != 'workflow_dispatch'
        # tauri-action v1 (migrated from v0). The inputs we use (tagName,
        # releaseName, releaseBody, releaseDraft, prerelease, args) are unchanged;
        # v1 only drops includeRelease/includeDebug/auto-init and renames
        # assetNamePattern (none of which we set). Note: v1's latest.json uses the
        # GitHub asset URL instead of browser_download_url — verified against a
        # throwaway pre-release so the in-app updater still resolves.
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code-signing (Developer ID Application, team M3FGXPBLFZ): tauri-action
          # imports the base64 .p12 from APPLE_CERTIFICATE and signs the app. Only runs on
          # a tag push (this Build step is gated off for workflow_dispatch above).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Notarization (re-enabled for 0.4.1): notarytool --wait submits the signed
          # app to Apple and staples the ticket, so macOS opens it without the
          # right-click -> Open dance. It hung on Apple's service during the 0.4.0 cut;
          # the 60-minute job cap above bounds a repeat hang. If it stalls again,
          # comment these two out for a signed-but-not-notarized build.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # Windows code-signing: artifact-signing-cli reads these three itself.
          # They are harmless on the macOS and Linux legs, which never invoke it.
          # The client secret expires 2028-08-11 and the identity validation behind
          # the certificate profile on 2028-10-23 — both fail this build silently
          # late rather than loudly now.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Plainva ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          # The signing config is a separate file loaded only on the Windows leg, so
          # local builds and outside contributors never trip over a signCommand they
          # cannot run. The path is relative to the REPOSITORY ROOT, not to the app
          # directory: tauri-action finds apps/desktop itself but runs the CLI from
          # the workspace root. The first 0.6.3 build failed here with "Provided
          # config path D:\a\plainva\plainva\src-tauri\... does not exist", which is
          # exactly that base directory — measured, not assumed.
          args: >-
            ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin'
            || (matrix.platform == 'windows-latest' && '--config apps/desktop/src-tauri/tauri.signing.conf.json' || '') }}

      # Guard against the one signing failure that passes every check on the day
      # it happens and breaks days later for every user: a signature without a
      # timestamp. Azure Trusted Signing hands out short-lived certificates — the
      # 0.6.7 signer expired the day after the cut, and the 0.6.6 signer was
      # already expired when it was measured on 2026-08-18. Both stayed Valid
      # solely because they carry an RFC 3161 timestamp. The timestamp comes from
      # the service rather than from a flag we pass, so nothing here can forget
      # it — but nothing asserted it either, and a checklist item that a human
      # runs after the fact is not a guard. This fails the release cut instead.
      # It also covers the application binary, not just the installers: that is
      # the one users execute, and whether it was signed had been an open
      # question since 0.6.6 (it is — proven at 0.6.7 by extracting the NSIS
      # archive). The binary is taken OUT of the MSI for that, because the copy
      # left in target/release is never signed; pointing at it failed the 0.6.8
      # cut on a file that is not shipped.
      - name: Verify Windows signatures carry a timestamp
        if: matrix.platform == 'windows-latest' && github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: |
          $root = "apps/desktop/src-tauri/target/release"
          $targets = @(
            "$root/bundle/nsis/*.exe",
            "$root/bundle/msi/*.msi"
          )
          # NOT "$root/plainva-desktop.exe": that is the raw build output, which Tauri
          # never signs — it signs the copy it packs into the installers. Checking it
          # failed the 0.6.8 cut for a file nobody ships. The binary a user actually gets
          # is the one inside the MSI, so extract it and measure that (finding 2026-08-22).
          $extract = Join-Path $env:RUNNER_TEMP "msi-extract"
          $msi = Get-ChildItem -Path "$root/bundle/msi/*.msi" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($msi) {
            New-Item -ItemType Directory -Force -Path $extract | Out-Null
            $p = Start-Process msiexec -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$extract`"" -Wait -PassThru
            if ($p.ExitCode -eq 0) {
              $inner = Get-ChildItem -Path $extract -Recurse -Filter "plainva-desktop.exe" -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($inner) { $targets += $inner.FullName }
              else { Write-Host "::warning::no plainva-desktop.exe inside the MSI" }
            } else {
              Write-Host "::warning::msiexec /a exited $($p.ExitCode); skipping the inner binary"
            }
          }
          $checked = 0
          $failed = @()
          foreach ($pattern in $targets) {
            $files = Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue
            if (-not $files) { $failed += "no artifact matched $pattern"; continue }
            foreach ($f in $files) {
              $checked++
              $sig = Get-AuthenticodeSignature $f.FullName
              $stamped = [bool]$sig.TimeStamperCertificate
              # Null-safe on purpose: an unsigned file has no SignerCertificate, and
              # $null.Subject.Split() throws — which killed the step before the two
              # checks below could report anything. A guard that crashes says nothing.
              $signer = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject.Split(',')[0] } else { '<unsigned>' }
              "{0}: {1}, timestamped={2}, signer={3}" -f $f.Name, $sig.Status, $stamped, $signer
              if ($sig.Status -ne 'Valid') { $failed += "$($f.Name): status $($sig.Status)" }
              if (-not $stamped) { $failed += "$($f.Name): signed but NOT timestamped" }
            }
          }
          if ($failed.Count -gt 0) {
            $failed | ForEach-Object { Write-Host "::error::$_" }
            throw "Windows signature check failed ($($failed.Count) of $checked artifacts)"
          }
          "All $checked Windows artifacts are signed and timestamped."
